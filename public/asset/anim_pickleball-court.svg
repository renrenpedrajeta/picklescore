<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 25 572 385" width="100%" height="auto" role="img" aria-label="Pickleball rally animation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <style>
        /* Base Animation Classes (fallback for reduced motion is static) */
        .dust {
            fill: none;
            stroke: #f1e8cf;
            stroke-width: 2.5;
            opacity: 0;
        }

        @media (prefers-reduced-motion: no-preference) {
            .anim-ground { animation: rally-ground 8s linear infinite; }
            .anim-height { animation: rally-height 8s linear infinite; }
            .anim-shadow { animation: rally-shadow 8s linear infinite; }
            .anim-squash { animation: rally-squash 8s linear infinite; }
            .anim-spin { animation: rally-spin 8s linear infinite; }
            .anim-net { animation: net-wobble 8s linear infinite; }
            .anim-dust-1 { animation: dust-1 8s linear infinite; }
            .anim-dust-2 { animation: dust-2 8s linear infinite; }
            .anim-dust-3 { animation: dust-3 8s linear infinite; }
        }

        /* 
         * RALLY BEATS (8s Loop)
         * 0% - 18.75%: Serve to far right
         * 18.75% - 37.5%: Return to near left
         * 37.5% - 52.5%: Volley to far left
         * 52.5% - 71.25%: Final return to near center
         * 71.25% - 85%: Settling bounces
         * 85% - 100%: Rest
         */

        /* XY Ground Plane Translation */
        @keyframes rally-ground {
            0% { transform: translate(285px, 290px); }
            18.75% { transform: translate(387px, 212px); } /* Bounce 1 */
            37.5% { transform: translate(140px, 245px); } /* Volley hit (no bounce) */
            52.5% { transform: translate(267px, 152px); } /* Bounce 2 */
            71.25% { transform: translate(285px, 290px); } /* Final bounce */
            74% { transform: translate(285px, 290px); } /* Settle bounce 1 */
            76.5% { transform: translate(285px, 290px); } /* Settle bounce 2 */
            78% { transform: translate(285px, 290px); }
            100% { transform: translate(285px, 290px); }
        }

        /* Z-Axis Vertical Arcs */
        @keyframes rally-height {
            0% { transform: translateY(0px); animation-timing-function: cubic-bezier(0.2, 0.6, 0.4, 1); }
            9.375% { transform: translateY(-78px); animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4); } /* Serve apex */
            18.75% { transform: translateY(0px); animation-timing-function: cubic-bezier(0.2, 0.6, 0.4, 1); }
            28.125% { transform: translateY(-60px); animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4); } /* Return apex */
            37.5% { transform: translateY(-20px); animation-timing-function: cubic-bezier(0.2, 0.6, 0.4, 1); } /* Hit early/volley */
            45% { transform: translateY(-55px); animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4); } /* Volley apex */
            52.5% { transform: translateY(0px); animation-timing-function: cubic-bezier(0.2, 0.6, 0.4, 1); }
            61.875% { transform: translateY(-70px); animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4); } /* Final return apex */
            71.25% { transform: translateY(0px); animation-timing-function: cubic-bezier(0.2, 0.6, 0.4, 1); }
            73.5% { transform: translateY(-15px); animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4); } /* Micro-bounce 1 */
            75.5% { transform: translateY(0px); animation-timing-function: cubic-bezier(0.2, 0.6, 0.4, 1); }
            77% { transform: translateY(-5px); animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4); } /* Micro-bounce 2 */
            78.5% { transform: translateY(0px); animation-timing-function: ease-in-out; }
            85% { transform: translateY(-1.5px); animation-timing-function: ease-in-out; } /* Idle gentle bob */
            92% { transform: translateY(0px); animation-timing-function: ease-in-out; }
            97% { transform: translateY(-0.5px); animation-timing-function: ease-in-out; }
            100% { transform: translateY(0px); }
        }

        /* Shadow Scaling and Opacity */
        @keyframes rally-shadow {
            0% { transform: scale(1); opacity: 0.35; animation-timing-function: cubic-bezier(0.2, 0.6, 0.4, 1); }
            9.375% { transform: scale(0.4); opacity: 0.1; animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4); }
            18.75% { transform: scale(1); opacity: 0.35; animation-timing-function: cubic-bezier(0.2, 0.6, 0.4, 1); }
            28.125% { transform: scale(0.5); opacity: 0.15; animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4); }
            37.5% { transform: scale(0.85); opacity: 0.28; animation-timing-function: cubic-bezier(0.2, 0.6, 0.4, 1); }
            45% { transform: scale(0.55); opacity: 0.18; animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4); }
            52.5% { transform: scale(1); opacity: 0.35; animation-timing-function: cubic-bezier(0.2, 0.6, 0.4, 1); }
            61.875% { transform: scale(0.45); opacity: 0.12; animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4); }
            71.25% { transform: scale(1); opacity: 0.35; animation-timing-function: cubic-bezier(0.2, 0.6, 0.4, 1); }
            73.5% { transform: scale(0.7); opacity: 0.2; animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4); }
            75.5% { transform: scale(1); opacity: 0.35; animation-timing-function: cubic-bezier(0.2, 0.6, 0.4, 1); }
            77% { transform: scale(0.9); opacity: 0.3; animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4); }
            78.5% { transform: scale(1); opacity: 0.35; animation-timing-function: linear; }
            100% { transform: scale(1); opacity: 0.35; }
        }

        /* Ball Squash/Stretch on Impact */
        @keyframes rally-squash {
            0%, 17.5% { transform: scale(1, 1); }
            18.75% { transform: scale(1.15, 0.85); }
            19.5% { transform: scale(0.95, 1.05); }
            20.5%, 51.5% { transform: scale(1, 1); }
            52.5% { transform: scale(1.15, 0.85); }
            53.25% { transform: scale(0.95, 1.05); }
            54.25%, 70.25% { transform: scale(1, 1); }
            71.25% { transform: scale(1.15, 0.85); }
            72% { transform: scale(0.95, 1.05); }
            73%, 100% { transform: scale(1, 1); }
        }

        /* Ball Rotation */
        @keyframes rally-spin {
            0% { transform: rotate(0deg); }
            18.75% { transform: rotate(360deg); }
            37.5% { transform: rotate(720deg); }
            52.5% { transform: rotate(1080deg); }
            71.25% { transform: rotate(1440deg); }
            100% { transform: rotate(1440deg); }
        }

        /* Net Wobble on ball passing over */
        @keyframes net-wobble {
            0%, 7%, 12%, 26%, 31%, 43%, 48%, 60%, 65%, 100% { transform: translateY(0); }
            9.375% { transform: translateY(-1.5px); }
            28.125% { transform: translateY(-1.5px); }
            45% { transform: translateY(-1.5px); }
            61.875% { transform: translateY(-1.5px); }
        }

        /* Dust Puffs at Bounce Points */
        @keyframes dust-1 {
            0%, 18% { transform: scale(0.2); opacity: 0; }
            18.75% { transform: scale(0.5); opacity: 0.7; }
            22% { transform: scale(1.8); opacity: 0; }
            100% { transform: scale(1.8); opacity: 0; }
        }
        @keyframes dust-2 {
            0%, 51.5% { transform: scale(0.2); opacity: 0; }
            52.5% { transform: scale(0.5); opacity: 0.7; }
            55.5% { transform: scale(1.8); opacity: 0; }
            100% { transform: scale(1.8); opacity: 0; }
        }
        @keyframes dust-3 {
            0%, 70.25% { transform: scale(0.2); opacity: 0; }
            71.25% { transform: scale(0.5); opacity: 0.7; }
            74.5% { transform: scale(1.8); opacity: 0; }
            100% { transform: scale(1.8); opacity: 0; }
        }
    </style>

<!-- Static Court Structure -->
    <g id="court">
        <!-- Apron Shadow -->
        <polygon points="15,238 262,58 540,203 290,383" fill="#c3d0c6" transform="translate(0, 15)" />
        
        <!-- Apron Base -->
        <polygon points="15,238 262,58 540,203 290,383" fill="#a3b19e" />
        
        <!-- Playing Surface -->
        <polygon points="55,232 265,80 500,203 290,357" fill="#26705f" />

        <!-- Lighter Teal Net Strip -->
        <polygon points="155,160 395,280 385,285 145,165" fill="#5a9985" />

        <!-- Court Lines -->
        <g stroke="#f1e8cf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <!-- Outer Boundary -->
            <polygon points="55,232 265,80 500,203 290,357" fill="none" />
            <!-- Far Kitchen Line -->
            <line x1="197" y1="129" x2="432" y2="253" />
            <!-- Near Kitchen Line -->
            <line x1="123" y1="183" x2="358" y2="307" />
            <!-- Far Centerline -->
            <line x1="314.5" y1="191" x2="382.5" y2="141.5" />
            <!-- Near Centerline -->
            <line x1="240.5" y1="245" x2="172.5" y2="294.5" />
        </g>
    </g>

    <!-- Dust Impact Layer -->
    <g id="dust-layer">
        <g transform="translate(387, 212)">
            <ellipse cx="0" cy="0" rx="12" ry="6" class="dust anim-dust-1" style="transform-origin: 0 0;" />
        </g>
        <g transform="translate(267, 152)">
            <ellipse cx="0" cy="0" rx="12" ry="6" class="dust anim-dust-2" style="transform-origin: 0 0;" />
        </g>
        <g transform="translate(285, 290)">
            <ellipse cx="0" cy="0" rx="12" ry="6" class="dust anim-dust-3" style="transform-origin: 0 0;" />
        </g>
    </g>

    <!-- Net Structure (Animated Wobble) -->
    <g id="net" class="anim-net">
        <!-- Mesh Background -->
        <polygon points="152,120 422,265 422,300 152,155" fill="#14403a" opacity="0.6"/>
        
        <!-- Top Tape -->
        <line x1="152" y1="120" x2="422" y2="265" stroke="#f1e8cf" stroke-width="3" stroke-linecap="round"/>
        
        <!-- Subtle Mesh Weave Simulation -->
        <path d="M 179,134 L 179,169 M 206,149 L 206,184 M 233,163 L 233,198 M 260,178 L 260,213 M 287,192 L 287,227 M 314,207 L 314,242 M 341,221 L 341,256 M 368,236 L 368,271 M 395,250 L 395,285" stroke="#a3b19e" stroke-width="0.75" opacity="0.5"/>
        
        <!-- Posts -->
        <line x1="152" y1="110" x2="152" y2="168" stroke="#0c2622" stroke-width="5" stroke-linecap="round"/>
        <line x1="422" y1="255" x2="422" y2="313" stroke="#0c2622" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Animated Ball & Shadow -->
    <g class="anim-ground" transform="translate(285, 290)">
        
        <!-- Ground Shadow -->
        <ellipse cx="0" cy="0" rx="10" ry="5" fill="#0c2622" class="anim-shadow" style="transform-origin: 0px 0px;" />

        <!-- Vertical Height Group -->
        <g class="anim-height">
            
            <!-- Impact Squash Group -->
            <g class="anim-squash" style="transform-origin: 0px 0px;">
                
                <!-- Rotation Group -->
                <g class="anim-spin" style="transform-origin: 0px 0px;">
                    
                    <!-- Ball Base -->
                    <circle cx="0" cy="0" r="10" fill="#e5e88a" />
                    
                    <!-- Pickleball Holes -->
                    <circle cx="-3" cy="-3" r="1.5" fill="#a0a843" />
                    <circle cx="4" cy="-1" r="1.5" fill="#a0a843" />
                    <circle cx="0" cy="4" r="1.5" fill="#a0a843" />
                </g>
            </g>
        </g>
    </g>
</svg>
